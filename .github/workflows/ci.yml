# CI/CD Letterbox
# - Job backend  : php artisan test
# - Job frontend : npm ci + lint/test + npm run build
# - Job deploy   : HANYA untuk push ke main (build & push image ke GHCR, tag commit SHA)
#
# Pull Request, branch dev, dan branch fitur berhenti setelah job pengujian & build.
name: CI/CD

on:
  push:
    branches: [main, dev, "feature/**"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write # wajib agar GITHUB_TOKEN boleh push image ke GHCR

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Laravel test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_mysql
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependensi
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Siapkan .env (APP_KEY dari GitHub Secrets)
        env:
          APP_KEY_SECRET: ${{ secrets.APP_KEY }}
        run: |
          cp .env.example .env
          if [ -n "$APP_KEY_SECRET" ]; then
            sed -i "s|^APP_KEY=.*|APP_KEY=${APP_KEY_SECRET}|" .env
          else
            php artisan key:generate --ansi
          fi

      - name: Jalankan feature test (php artisan test)
        run: php artisan test

  frontend:
    name: Frontend (npm ci + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependensi
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit test
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || '/api' }}

  deploy:
    name: Deploy (build & push GHCR)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Hanya berjalan untuk push ke main. PR/dev/feature berhenti di job di atas.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      # GHCR mewajibkan nama image huruf kecil semua.
      - name: Tentukan nama image
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Memastikan docker-compose.yml valid dengan kredensial dari Secrets.
      # --quiet tidak mencetak nilai rahasia ke log.
      - name: Validasi konfigurasi Docker Compose
        run: docker compose config --quiet
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          MYSQL_DATABASE: letterbox
          MYSQL_USER: letterbox
          MYSQL_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          VITE_API_URL: /api

      - name: Build & push image backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push image frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL || '/api' }}
          tags: ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
