server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Frontend memanggil /api (origin yang sama). Nginx meneruskan ke backend
    # memakai NAMA SERVICE Docker Compose, bukan alamat IP laptop.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check Laravel juga bisa dicek lewat frontend.
    location = /up {
        proxy_pass http://backend:8000/up;
        proxy_set_header Host $host;
    }

    # SPA (vue-router history mode): rute tak dikenal dikembalikan ke index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
